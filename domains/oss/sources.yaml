# Structured backbone for the Python packaging ecosystem.
#
# No LLM is involved here. Package identity and dependency edges are facts
# published by the index, so they are loaded deterministically and become the
# ground truth that phase 4 evaluates extraction against.
#
# Sources are the public PyPI JSON API and a download-ranked package list. The
# plan's first choice was the deps.dev BigQuery dataset; that was dropped
# because it needs a billed Google Cloud project, and this path costs nothing,
# needs no credentials, and can be re-run by anyone reading this file.

normalize:
  # PEP 503: lowercase, then collapse runs of -, _ and . into a single -.
  # Spelled out rather than named after the specification, so the operations
  # stay generic and the rule stays visible.
  pypi_name:
    - strip
    - lower
    - {regex_replace: {pattern: "[-_.]+", replace: "-"}}

  # A dependency is published as a PEP 508 requirement string, e.g.
  #   'charset-normalizer<4,>=2; python_version >= "3.8"'
  # The distribution name is everything up to the first version specifier,
  # extras bracket, marker semicolon or space.
  requirement_name:
    - strip
    - {regex_extract: {pattern: "^([A-Za-z0-9][A-Za-z0-9._-]*)"}}
    - lower
    - {regex_replace: {pattern: "[-_.]+", replace: "-"}}

  # Repository URLs arrive with assorted decoration: a trailing slash, a .git
  # suffix, a tree/branch path. Reduce to owner/repo so the same repository
  # reached by two routes becomes one node.
  #
  # Not every github.com path is a repository. A funding link points at
  # github.com/sponsors/<person>, which has exactly the shape of owner/repo and
  # is not one — that produced eleven "repositories" named after maintainers.
  # The reserved first segments are excluded by refusing to match them.
  repo_slug:
    - strip
    - lower
    - {regex_extract: {pattern: "github\\.com[:/]+(?!sponsors/|orgs/|users/|settings/|features/|about/|marketplace/|apps/|topics/|collections/|security/|pricing/|login/)([^/]+/[^/#?]+)"}}
    - {regex_replace: {pattern: "\\.git$", replace: ""}}

fetch:
  # Download-ranked package list, refreshed monthly from the public PyPI
  # download statistics. Only the ranking comes from here; every fact about a
  # package comes from the index itself.
  - id: top-packages
    url: https://raw.githubusercontent.com/hugovk/top-pypi-packages/main/top-pypi-packages.min.json
    select: rows
    # Widened from 1,000 after two rounds of error analysis pointed at the same
    # thing: half of all package mentions resolved to packages the backbone did
    # not contain, so five sixths of the corpus produced no scoreable pair. The
    # ceiling was coverage, not extraction — a controlled re-run on a hosted
    # model with the ontology enforced moved conformance to 100% and F1 not at
    # all. Backbones load without a model, so this costs requests and no tokens.
    limit: 8000
    out: top-packages.jsonl

  # One request per package. `keep` trims each response — they run to megabytes
  # because they enumerate every file of every release, and none of that is
  # needed here.
  - id: packages
    url: "https://pypi.org/pypi/{project}/json"
    for_each: top-packages.jsonl
    out: packages.jsonl
    concurrency: 8
    on_error: skip          # a name in the ranking can be yanked or renamed
    keep:
      name: info.name
      version: info.version
      summary: info.summary
      license: info.license
      requires_dist: info.requires_dist
      home_page: info.home_page
      # The whole map, not named keys. Publishers file the repository under
      # "Source", "source", "Source Code", "Repository", "Homepage", "Home",
      # "Code" and more; enumerating them is a game you lose slowly.
      project_urls: info.project_urls

  # Issue threads — the unstructured half. One request per repository returns a
  # page of issues, and each becomes a document. This is where package names
  # appear as prose ("switching to httpx fixed it") rather than as metadata,
  # which is exactly what extraction and resolution have to cope with.
  #
  # Unauthenticated GitHub allows 60 requests an hour, which is not enough.
  # Export GITHUB_TOKEN (`gh auth token`) for 5,000.
  - id: issues
    url: "https://api.github.com/repos/{slug}/issues?state=all&per_page=30&sort=comments&direction=desc"
    for_each: repos.jsonl
    out: issues.jsonl
    concurrency: 4
    on_error: skip           # archived or renamed repositories, disabled issues
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
      X-GitHub-Api-Version: "2022-11-28"
    keep:
      number: number
      title: title
      body: body
      state: state
      url: html_url
      author: user.login
      comments: comments
      created_at: created_at
      pull_request: pull_request.url

derive:
  # The repository list is already implied by the package records; asking for it
  # again would only risk the two disagreeing. `unique` collapses the many
  # packages that share a repository — the whole google-cloud-* family points at
  # a handful of monorepos.
  - id: repos
    source: packages.jsonl
    out: repos.jsonl
    explode: project_urls
    fields:
      slug: "{value|repo_slug}"
      package: "{name|pypi_name}"
    require: [slug]
    unique: slug
    limit: 120

load:
  - source: packages.jsonl
    node:
      label: Package
      id: "pypi:{name|pypi_name}"
      properties:
        name: "{name}"
        latest_version: "{version}"
        summary: "{summary}"
        license: "{license}"

  - source: packages.jsonl
    node:
      label: Release
      id: "pypi:{name|pypi_name}@{version}"
      properties:
        version: "{version}"

  - source: packages.jsonl
    edge:
      type: HAS_RELEASE
      from: "pypi:{name|pypi_name}"
      to: "pypi:{name|pypi_name}@{version}"

  # Repositories, found by looking at every project URL rather than at chosen
  # key names. A package usually lists several — issues, changelog, source —
  # and repo_slug reduces all of them to the same owner/repo, so MERGE collapses
  # them into one node. URLs that are not GitHub render empty and are skipped.
  - source: packages.jsonl
    explode: project_urls
    node:
      label: Repository
      id: "gh:{value|repo_slug}"
      properties:
        slug: "{value|repo_slug}"

  - source: packages.jsonl
    explode: project_urls
    edge:
      type: HOSTED_IN
      from: "pypi:{name|pypi_name}"
      to: "gh:{value|repo_slug}"

  # Packages that set no project URLs at all still often name the repository as
  # their homepage.
  - source: packages.jsonl
    node:
      label: Repository
      id: "gh:{home_page|repo_slug}"
      properties:
        slug: "{home_page|repo_slug}"

  - source: packages.jsonl
    edge:
      type: HOSTED_IN
      from: "pypi:{name|pypi_name}"
      to: "gh:{home_page|repo_slug}"

  # Dependency edges. `explode` yields one row per requirement string, exposed
  # to templates as {value}.
  #
  # Requirements carrying an `extra ==` marker are only installed when someone
  # asks for that extra, so they are excluded: the question this backbone has to
  # answer is "if this package broke, what actually breaks with it", and an
  # optional extra does not.
  - source: packages.jsonl
    explode: requires_dist
    where:
      value: {not_matches: "extra\\s*=="}
    edge:
      type: DEPENDS_ON
      from: "pypi:{name|pypi_name}"
      to: "pypi:{value|requirement_name}"
      properties:
        requirement: "{value}"

  # Issue threads as nodes, not only as documents.
  #
  # This is what the tr-law pack has and this one did not. There, a decision is
  # both a document and a graph node, so every statute it cites is a scoreable
  # fact about that document: 150 gold edges out of 200 documents. Here the
  # documents were outside the graph entirely, so gold could only come from two
  # *related* packages happening to appear in the same thread — and 69% of these
  # threads mention exactly one package, which is why widening the backbone
  # eight-fold moved the gold set from 22 edges to 24.
  #
  # The id is the corpus id template character for character. `document_edges`
  # joins these nodes to ingested documents on `d.id = chunk.ref_doc_id`, and a
  # template that drifts by one character produces an empty gold set rather than
  # an error. `packs validate` now checks the two agree.
  - source: issues.jsonl
    node:
      label: Issue
      id: "gh:{slug}#{number}"
      properties:
        title: "{title}"

  # The thread belongs to a repository, and that repository belongs to a package.
  # So "which package is this thread about" is a fact the index already publishes
  # and no model is needed to obtain it — the same bargain as everything above.
  #
  # One package per thread, because the repos derive step is `unique: slug`. For
  # a monorepo that means the package named is one of several the repository
  # publishes, which puts some noise in the gold; it is not bias, and it is the
  # honest limit of deriving this from published metadata alone.
  - source: issues.jsonl
    edge:
      type: MENTIONS_PACKAGE
      from: "gh:{slug}#{number}"
      to: "pypi:{package|pypi_name}"

  - source: issues.jsonl
    edge:
      type: REPORTED_IN
      from: "gh:{slug}#{number}"
      to: "gh:{slug}"

# The unstructured half: issue threads become documents for the engine to chunk,
# embed and extract from. What extraction pulls out of this prose is later
# resolved against the backbone above — that comparison is the evaluation.
corpus:
  - source: issues.jsonl
    id: "gh:{slug}#{number}"
    text: "{title}\n\n{body}"
    metadata:
      title: "{title}"
      repo: "{slug}"
      url: "{url}"
      author: "{author}"
      state: "{state}"
      created_at: "{created_at}"

    # Metadata is part of the prompt: LlamaIndex prepends every key to the chunk
    # as `key: value` before the model reads it, so a field kept for bookkeeping
    # is a field extraction treats as document content. That is where the entity
    # `pack: oss`, typed PACKAGE, came from — and where `URL` and `DATE` entity
    # noise comes from, neither of which the ontology declares.
    #
    # These three are bookkeeping. They stay queryable in the store and are
    # excluded from both the model's view and the embedding's.
    #
    # Three are kept, deliberately. `title` and `repo` are genuine context for
    # what the thread is about. `author` is too, and is more arguable: it is a
    # GitHub handle rather than prose, but PERSON is a type this ontology
    # declares and "who opened this" is a fact about the document rather than
    # about our bookkeeping. It stays, so this change has one variable.
    #
    # Left unapplied until now on purpose, so the committed configuration
    # matched the run that produced the published numbers. Re-running costs
    # minutes on a hosted model rather than the ten hours it cost locally, so
    # that reason has expired.
    hide_from_model: [url, state, created_at]

    where:
      # A closed issue with an empty body is a duplicate marker, not a document.
      body: {matches: "\\S"}
