# Citation masking: the decision states its own ground truth.
#
# The oss pack got its gold from an index that publishes dependency lists. There
# is no such index here — nobody maintains a machine-readable record of which
# statutes each decision relies on. But the decision says so itself, in the
# text, and a pattern can read it out deterministically before any model runs.
#
# So the bargain is the same and the mechanism is different, which is the claim
# being tested: the backbone was built from citations found by regex, and
# extraction is now scored on whether an LLM reading the same text finds the
# same citations. The patterns and the model see identical input and neither
# sees the other's answer.
#
# What this can and cannot show. A citation the pattern missed is not in the
# gold, so the model gets no credit for finding it — recall is measured against
# what the patterns caught, not against what is there. Precision is the more
# honest half: a citation the model claims and the pattern did not find is
# either a real catch or an invention, and the report separates neither. Phase 4
# says the same thing about the oss false positives, for the same reason.

tasks:
  # The document is a node here, which the oss pack's shape does not cover.
  # A decision cites statutes, so the fact extraction has to find is
  # "(this decision, that statute)". Asking for two endpoints of the same label
  # — as `backbone_edges` does — looks for `Statute -[:CITES]-> Statute`, of
  # which this backbone holds zero against 2,367 `Decision -[:CITES]-> Statute`.
  # Written that way first, it would have scored an empty gold set after a
  # fifteen-hour extraction run.
  - name: statute_citations
    generator: document_edges
    relation: CITES
    backbone_relation: CITES
    source_label: Decision
    endpoint_label: Statute
    directed: true

  - name: article_citations
    generator: document_edges
    relation: CITES_ARTICLE
    backbone_relation: CITES_ARTICLE
    source_label: Decision
    endpoint_label: Article
    directed: true

  # The same gold, scored against relation extraction rather than mentions.
  #
  # The two tasks above ask "did the document name a statute a reader could
  # identify". That is a real question and a fair measurement, but it is not
  # what `relation: CITES` sounds like — and until `require_relation` existed,
  # the declared relation was parsed and never used. The graph holds 170 `CITES`
  # relations against 1,242 gold edges, so the strict number is a different
  # number, and it is the one that says anything about relation extraction.
  #
  # Both are kept. Removing the loose pair would delete two phases of published
  # measurement; removing the strict pair would go back to reporting one
  # quantity under the other's name.
  - name: statute_citations_strict
    generator: document_edges
    relation: CITES
    backbone_relation: CITES
    source_label: Decision
    endpoint_label: Statute
    directed: true
    require_relation: true

  - name: article_citations_strict
    generator: document_edges
    relation: CITES_ARTICLE
    backbone_relation: CITES_ARTICLE
    source_label: Decision
    endpoint_label: Article
    directed: true
    require_relation: true

# Thirty percent of decisions are held out, and this pack is the reason the
# other two are not.
#
# The rule is written in domains/oss/eval.yaml: a holdout protects against rules
# fitted to the data being scored, and it becomes necessary "the moment the error
# analysis feeds back into aliases.csv or a normaliser". That moment happened
# here. The `article_number` normaliser in resolve.yaml was written for the
# `context:` block, its shape was taken from looking at unresolved mentions in
# this corpus, and the decision to build the feature at all came from simulating
# it against these very documents — 282 of 371 would land, so it was worth
# building. All true, and all of it read the answers first.
#
# So: scored on the held-out 30%, split by decision. What that does *not* buy is
# a clean measurement, and pretending otherwise would be worse than no holdout.
# The design saw the whole corpus; a real holdout fixes the split before the
# design, not after. What it does buy is a check on the specific mentions I read
# — those are almost all in the other 70%.
#
# The mitigating fact, stated so a reader can weigh it: `article_number` extracts
# the first one-to-three digit number and nothing else. It is not fitted to
# particular misses; it is the shape every article citation in the language has.
#
# RESULTS.md carries both numbers, and says which is which.
  # The whole claim, and the level the other two stop short of.
  #
  # `require_relation` accepts any subject the document's chunks mention, which
  # is neither "the document names it" nor "the document says it cites it" —
  # the subject may be a party, a lower court, or something that resolved to
  # nothing. Requiring the subject to be the document itself is what the task's
  # name has always sounded like.

  - name: statute_citations_subject
    generator: document_edges
    relation: CITES
    backbone_relation: CITES
    source_label: Decision
    endpoint_label: Statute
    directed: true
    require_relation: true
    require_subject: true

  - name: article_citations_subject
    generator: document_edges
    relation: CITES_ARTICLE
    backbone_relation: CITES_ARTICLE
    source_label: Decision
    endpoint_label: Article
    directed: true
    require_relation: true
    require_subject: true

holdout: 0.3
seed: 0
